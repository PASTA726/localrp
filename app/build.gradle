plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.localrp'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'app.localrp'
        minSdk 33
        targetSdk 36
        versionCode 65
        versionName '0.31.00'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // v0.31.00: signed release builds. Credentials live in an untracked
    // keystore.properties (project root); CI has no such file and keeps producing
    // an unsigned release exactly as before. No R8/minify yet — llama.cpp JNI and
    // the reflection-based engine surface would need a reviewed keep-rules pass
    // first; the signed APK differs from the debug one only in signature/meta.
    if (rootProject.file("keystore.properties").exists()) {
        def keystorePropsFile = rootProject.file("keystore.properties")
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.arm:ai-chat:0.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    // persistence codec unit tests: org.json ships with Android but not on the JVM test classpath
    testImplementation 'org.json:json:20240303'
}
